name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.11'
          - os: windows-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python evals/run_evals.py
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-pdf.txt
      - run: python -m unittest discover -s tests -p test_search_local_pdf.py -v
